<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle background gradient -->
  <defs>
    <radialGradient id="logoGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#FFF;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Main circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)"/>
  
  <!-- Decorative dots around circle -->
  <circle cx="50" cy="30" r="4" fill="#FFF" opacity="0.6"/>
  <circle cx="30" cy="60" r="3" fill="#FFF" opacity="0.5"/>
  <circle cx="170" cy="45" r="4" fill="#FFF" opacity="0.6"/>
  <circle cx="160" cy="75" r="3" fill="#FFF" opacity="0.5"/>
  <circle cx="40" cy="140" r="3" fill="#FFF" opacity="0.5"/>
  <circle cx="175" cy="160" r="4" fill="#FFF" opacity="0.6"/>
  <circle cx="150" cy="180" r="3" fill="#FFF" opacity="0.5"/>
  
  <!-- Dollar sign circle (top right) -->
  <circle cx="145" cy="60" r="20" fill="#FFF" opacity="0.9"/>
  <text x="145" y="70" font-size="24" font-weight="bold" text-anchor="middle" fill="#FF8C00">$</text>
  
  <!-- Main arrow pointing up-right -->
  <path d="M 80 60 L 130 35 L 115 75 Q 100 85 80 60" fill="#FFF" opacity="0.95" stroke="none"/>
  
  <!-- Secondary arrow pointing down-right -->
  <path d="M 90 140 L 140 110 L 125 150 Q 110 160 90 140" fill="#FFF" opacity="0.85" stroke="none"/>
  
  <!-- Curved smile/arc -->
  <path d="M 75 120 Q 100 140 135 115" stroke="#FFF" stroke-width="8" fill="none" opacity="0.9" stroke-linecap="round"/>
  
  <!-- Curved decorative lines -->
  <path d="M 60 90 Q 80 110 100 100" stroke="#FFF" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M 120 85 Q 130 95 140 100" stroke="#FFF" stroke-width="4" fill="none" opacity="0.7" stroke-linecap="round"/>
  
  <!-- Small decorative dots inside -->
  <circle cx="70" cy="110" r="2.5" fill="#FFF" opacity="0.8"/>
  <circle cx="130" cy="95" r="2.5" fill="#FFF" opacity="0.8"/>
  <circle cx="100" cy="130" r="2.5" fill="#FFF" opacity="0.8"/>
</svg>